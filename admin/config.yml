backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

locale: de

collections:
  - name: "deutsch"
    label: "Deutsch"
    files:
      - name: "startseite"
        label: "Startseite"
        file: "content/de/startseite.json"
        fields:
          - { name: startseite_page_title, label: "Seitentitel – Browser / Google / Teilen", widget: string, required: false, hint: "Vollständiger Titel für den Browser-Tab und geteilte Links." }
          - name: hero_section
            label: "1. Titelbild und Begrüssung"
            widget: object
            collapsed: true
            fields:
              - { name: hero_eyebrow, label: "Kleiner Text oben", widget: string, required: false }
              - { name: hero_h1, label: "Hauptüberschrift", widget: string, required: false, hint: "Hier kannst du die grosse Überschrift der Startseite ändern." }
              - { name: hero_p, label: "Untertitel", widget: text, required: false }
              - { name: hero_btn1, label: "Button – Termin", widget: string, required: false }
              - { name: hero_btn2, label: "Button – Über mich", widget: string, required: false }
          - name: welcome_section
            label: "2. Willkommen und Einführung"
            widget: object
            collapsed: true
            fields:
              - { name: welcome_eyebrow, label: "Kleiner Text", widget: string, required: false }
              - { name: welcome_h2, label: "Überschrift", widget: string, required: false }
              - name: welcome_blocks
                label: "Absätze und weitere Inhalte"
                label_singular: "Inhaltselement"
                widget: list
                required: false
                types: &blocktypes_de
                  - { name: heading, label: "Überschrift", widget: object, fields: [ { name: text, label: "Text", widget: string, required: false } ] }
                  - { name: subheading, label: "Zwischentitel", widget: object, fields: [ { name: text, label: "Text", widget: string, required: false } ] }
                  - { name: text, label: "Absatz", widget: object, fields: [ { name: text, label: "Text", widget: text, required: false } ] }
                  - { name: quote, label: "Zitat", widget: object, fields: [ { name: text, label: "Text", widget: text, required: false } ] }
                  - { name: bullets, label: "Aufzählung", widget: object, fields: [ { name: items, label: "Punkte", widget: list, required: false } ] }
                  - { name: button, label: "Button", widget: object, fields: [ { name: text, label: "Beschriftung", widget: string, required: false }, { name: link, label: "Link (z.B. kontakt.html)", widget: string, required: false } ] }
                  - { name: image, label: "Bild", widget: object, fields: [ { name: image, label: "Bild", widget: image, required: false }, { name: alt, label: "Bildbeschreibung", widget: string, required: false } ] }
                  - { name: spacer, label: "Abstand", widget: object, fields: [ { name: size, label: "Höhe (z.B. 2rem)", widget: string, required: false, default: "2rem" } ] }
          - name: services_section
            label: "3. Angebote und Angebotskarten"
            widget: object
            collapsed: true
            fields:
              - { name: services_eyebrow, label: "Kleiner Text", widget: string, required: false }
              - { name: services_h2, label: "Überschrift", widget: string, required: false }
              - { name: services_p, label: "Einleitung", widget: text, required: false }
              - name: services_cards
                label: "Angebotskarten"
                label_singular: "Karte"
                widget: list
                required: false
                fields:
                  - { name: title, label: "Titel", widget: string, required: false }
                  - { name: desc, label: "Beschreibung", widget: text, required: false }
                  - { name: link_text, label: "Link-Text", widget: string, required: false }
                  - { name: link, label: "Link-Ziel", widget: string, required: false }
          - name: philosophy_section
            label: "4. Zitat"
            widget: object
            collapsed: true
            fields:
              - { name: phil_quote, label: "Zitattext", widget: text, required: false }
              - { name: phil_cite, label: "Name unter dem Zitat", widget: string, required: false }
          - name: about_section
            label: "5. Über mich"
            widget: object
            collapsed: true
            fields:
              - { name: aboutT_eyebrow, label: "Kleiner Text", widget: string, required: false }
              - { name: aboutT_h2, label: "Name / Überschrift", widget: string, required: false }
              - { name: aboutT_p1, label: "Absatz 1", widget: text, required: false }
              - { name: aboutT_p2, label: "Absatz 2", widget: text, required: false }
              - { name: aboutT_btn, label: "Button", widget: string, required: false }
          - name: gallery_section
            label: "6. Galerie"
            widget: object
            collapsed: true
            fields:
              - { name: gallery_eyebrow, label: "Kleiner Text", widget: string, required: false }
              - { name: gallery_h2, label: "Überschrift", widget: string, required: false }
              - { name: gallery_p, label: "Einleitung", widget: text, required: false }
              - name: gallery
                label: "Galeriebilder"
                label_singular: "Bild"
                widget: list
                required: false
                fields:
                  - { name: image, label: "Bild", widget: image, required: false }
                  - { name: caption, label: "Bildunterschrift", widget: string, required: false }
          - name: testimonials_section
            label: "7. Kundenstimmen"
            widget: object
            collapsed: true
            fields:
              - { name: testi_eb, label: "Kleiner Text", widget: string, required: false }
              - { name: testi_h2, label: "Überschrift", widget: string, required: false }
              - name: testimonials
                label: "Kundenstimmen"
                label_singular: "Kundenstimme"
                widget: list
                required: false
                fields:
                  - { name: quote, label: "Text", widget: text, required: false }
                  - { name: cite, label: "Name / Quelle", widget: string, required: false }
          - name: cta_section
            label: "8. Kontakt am Seitenende"
            widget: object
            collapsed: true
            fields:
              - { name: cta_h2, label: "Überschrift", widget: string, required: false }
              - { name: cta_p, label: "Text", widget: text, required: false }
              - { name: cta_btn1, label: "Button 1", widget: string, required: false }
              - { name: cta_btn2, label: "Button 2", widget: string, required: false }

      - name: "beratung"
        label: "Beratung"
        file: "content/de/beratung.json"
        fields:
          - { name: beratung_page_title, label: "Beratung – Browser-/SEO-Titel", widget: string, required: false, hint: "Der vollständige Titel im Browser-Tab und beim Teilen der Seite." }
          - { name: beratung_h1,         label: "Beratung – Hauptüberschrift", widget: string, required: false }
          - { name: beratung_subtitle,   label: "Beratung – Untertitel", widget: string, required: false }
          - { name: beratung_blocks, label: "Beratung – Inhalt", label_singular: "Element", widget: list, required: false, types: *blocktypes_de }

      - name: "supervision"
        label: "Supervision"
        file: "content/de/supervision.json"
        fields:
          - { name: supervision_page_title, label: "Supervision – Browser-/SEO-Titel", widget: string, required: false, hint: "Der vollständige Titel im Browser-Tab und beim Teilen der Seite." }
          - { name: supervision_h1,         label: "Supervision – Hauptüberschrift", widget: string, required: false }
          - { name: supervision_subtitle,   label: "Supervision – Untertitel", widget: string, required: false }
          - { name: supervision_blocks, label: "Supervision – Inhalt", label_singular: "Element", widget: list, required: false, types: *blocktypes_de }
          - { name: supervision_cta,       label: "Supervision – Button Text", widget: string, required: false }
          - { name: supervision_cta_link,  label: "Supervision – Button Link (z.B. kontakt.html#kontaktBooking)", widget: string, required: false }

      - name: "preise"
        label: "Preise"
        file: "content/de/preise.json"
        fields:
          - { name: preise_page_title, label: "Preise – Browser-/SEO-Titel", widget: string, required: false, hint: "Der vollständige Titel im Browser-Tab und beim Teilen der Seite." }
          - { name: preise_h1,         label: "Preise – Hauptüberschrift", widget: string, required: false }
          - { name: preise_subtitle,   label: "Preise – Untertitel", widget: string, required: false }
          - { name: preise_intro,      label: "Preise – Einleitung", widget: text, required: false }
          - { name: preise_intro_text, label: "Preise – Normaler Text zwischen Titel und Preiskarten", widget: text, required: false, hint: "Dieser Text erscheint direkt unter der Einleitung und über den Preiskarten." }
          - name: preise_cards
            label: "Preise – Preiskarten"
            label_singular: "Preiskarte"
            widget: list
            required: false
            fields:
              - { name: eyebrow,   label: "Beschriftung oben (z.B. 90 Minuten)", widget: string, required: false }
              - { name: currency,  label: "Währung", widget: string, required: false, default: "CHF" }
              - { name: price,     label: "Betrag (nur Zahl)", widget: string, required: false }
              - { name: unit,      label: "Einheit (z.B. / Stunde)", widget: string, required: false }
              - { name: desc,      label: "Beschreibung", widget: text, required: false }
              - { name: link_text, label: "Link-Text", widget: string, required: false }
              - { name: link,      label: "Link-Ziel", widget: string, required: false }
              - { name: featured,  label: "Hervorheben (dunkelgrüne Karte)", widget: boolean, required: false, default: false }
          - { name: preise_disc_h,     label: "Preise – Rabatt Titel", widget: string, required: false }
          - { name: preise_disc_intro, label: "Preise – Rabatt Einleitung", widget: text, required: false }
          - name: preise_discounts
            label: "Preise – Rabatte"
            label_singular: "Rabatt"
            widget: list
            required: false
            fields:
              - { name: amount, label: "Wert (z.B. 10 %)", widget: string, required: false }
              - { name: label,  label: "Beschreibung", widget: string, required: false }
          - { name: preise_pay_h,   label: "Preise – Bezahlung Titel", widget: string, required: false }
          - { name: preise_pay_p,   label: "Preise – Bezahlung Text", widget: text, required: false }
          - { name: preise_uns_h,   label: "Preise – Unsicher Titel", widget: string, required: false }
          - { name: preise_uns_p,   label: "Preise – Unsicher Text", widget: text, required: false }
          - { name: preise_uns_cta, label: "Preise – Button", widget: string, required: false }

      - name: "ueber-mich"
        label: "Über mich"
        file: "content/de/ueber-mich.json"
        fields:
          - { name: about_page_title, label: "Über mich – Browser-/SEO-Titel", widget: string, required: false, hint: "Der vollständige Titel im Browser-Tab und beim Teilen der Seite." }
          - { name: about_h1,         label: "Über mich – Hauptüberschrift", widget: string, required: false }
          - { name: about_subtitle,   label: "Über mich – Untertitel", widget: string, required: false }
          - { name: about_intro_heading, label: "Über mich – Überschrift über dem Einleitungstext", widget: string, required: false }
          - { name: about_intro_blocks, label: "Über mich – Einleitung", label_singular: "Element", widget: list, required: false, types: *blocktypes_de }
          - { name: about_values_heading, label: "Werte – Überschrift", widget: string, required: false }
          - { name: about_values_text, label: "Werte – Text", widget: text, required: false, hint: "Hier den Text zu den Werten einfügen. Der Abschnitt erscheint auf der Website, sobald Text eingetragen ist." }
          - { name: about_quote, label: "Über mich – Zitat (hervorgehoben)", widget: text, required: false }
          - { name: about_personal_blocks, label: "Über mich – Persönlich", label_singular: "Element", widget: list, required: false, types: *blocktypes_de }
          - { name: about_background_blocks, label: "Über mich – Fachlicher Hintergrund", label_singular: "Element", widget: list, required: false, types: *blocktypes_de }
          - { name: about_cta, label: "Über mich – Button", widget: string, required: false }

      - name: "kontakt"
        label: "Kontakt"
        file: "content/de/kontakt.json"
        fields:
          - { name: kontakt_page_title, label: "Kontakt – Browser-/SEO-Titel", widget: string, required: false, hint: "Der vollständige Titel im Browser-Tab und beim Teilen der Seite." }
          - { name: kontakt_h1,         label: "Kontakt – Hauptüberschrift", widget: string, required: false }
          - { name: kontakt_name,        label: "Kontakt – Name", widget: string, required: false }
          - { name: kontakt_subtitle,   label: "Kontakt – Untertitel", widget: string, required: false }
          - { name: kontakt_eb,         label: "Kontakt – Kleiner Text", widget: string, required: false }
          - { name: kontakt_cred,       label: "Kontakt – Berufsbezeichnung", widget: text, required: false }
          - { name: kontakt_mail_h, label: "Kontakt – Überschrift E-Mail", widget: string, required: false }
          - { name: kontakt_threema_h, label: "Kontakt – Überschrift Threema", widget: string, required: false }
          - { name: kontakt_whatsapp_h, label: "Kontakt – Überschrift WhatsApp", widget: string, required: false }
          - name: kontakt_methods
            label: "Kontakt – Kontaktmöglichkeiten"
            label_singular: "Kontaktmöglichkeit"
            widget: list
            required: false
            fields:
              - { name: title,      label: "Titel (z.B. Telefon)", widget: string, required: false }
              - { name: note,       label: "Zusatzzeile (optional)", widget: string, required: false }
              - { name: value,      label: "Anzeigetext (z.B. Nummer / Link-Text)", widget: string, required: false }
              - { name: value_href, label: "Link (z.B. tel:..., mailto:..., https://...)", widget: string, required: false }
          - { name: kontakt_note_h,    label: "Kontakt – Hinweis Titel", widget: string, required: false }
          - { name: kontakt_note_p,    label: "Kontakt – Hinweis Text", widget: text, required: false }
          - { name: kontakt_book_eb,   label: "Kontakt – Buchung Kleiner Text", widget: string, required: false }
          - { name: kontakt_book_h,    label: "Kontakt – Buchung Titel", widget: string, required: false }
          - { name: kontakt_book_p,    label: "Kontakt – Buchung Text", widget: text, required: false }
          - { name: kontakt_book_soon, label: "Kontakt – Buchung bald Text", widget: string, required: false }
          - { name: kontakt_book_fallback, label: "Kontakt – Buchung Fallback-Button", widget: string, required: false }

      - name: "agb"
        label: "AGB"
        file: "content/de/agb.json"
        fields:
          - { name: agb_page_title, label: "AGB – Browser-/SEO-Titel", widget: string, required: false, hint: "Der vollständige Titel im Browser-Tab und beim Teilen der Seite." }
          - { name: agb_h1,         label: "AGB – Hauptüberschrift", widget: string, required: false }
          - { name: agb_blocks, label: "AGB – Inhalt", label_singular: "Element", widget: list, required: false, types: *blocktypes_de }

      - name: "datenschutz"
        label: "Datenschutz"
        file: "content/de/datenschutz.json"
        fields:
          - { name: datenschutz_page_title, label: "Datenschutz – Browser-/SEO-Titel", widget: string, required: false, hint: "Der vollständige Titel im Browser-Tab und beim Teilen der Seite." }
          - { name: datenschutz_h1,         label: "Datenschutz – Hauptüberschrift", widget: string, required: false }
          - { name: datenschutz_blocks, label: "Datenschutz – Inhalt", label_singular: "Element", widget: list, required: false, types: *blocktypes_de }

      - name: "nutzung-impressum"
        label: "Nutzung & Impressum"
        file: "content/de/nutzung-impressum.json"
        fields:
          - { name: nutzung_page_title, label: "Nutzung – Browser-/SEO-Titel", widget: string, required: false, hint: "Der vollständige Titel im Browser-Tab und beim Teilen der Seite." }
          - { name: nutzung_h1,         label: "Nutzung – Hauptüberschrift", widget: string, required: false }
          - { name: nutzung_blocks, label: "Nutzung – Inhalt", label_singular: "Element", widget: list, required: false, types: *blocktypes_de }
          - { name: nutzung_resp_label, label: "Nutzung – Verantwortlich (Label)", widget: string, required: false }
          - { name: nutzung_resp_name,  label: "Nutzung – Verantwortlich (Name/Adresse)", widget: string, required: false }

      - name: "allgemein-footer"
        label: "Allgemein & Footer"
        file: "content/de/allgemein-footer.json"
        fields:
          - name: heading_style
            label: "Website – Überschriften-Schrift"
            widget: select
            options:
              - { label: "Stil 1 – Cormorant Garamond (aktuell)", value: cormorant }
              - { label: "Stil 2 – Playfair Display", value: playfair }
            default: cormorant
            required: false
            hint: "Legt die Schrift aller Überschriften auf der gesamten Website fest."
          - { name: brand_name,       label: "Allgemein – Markenname (Breadcrumb)", widget: string, required: false }
          - { name: footer_contact_name, label: "Footer – Kontaktname", widget: string, required: false }
          - { name: footer_nav_header, label: "Footer – Überschrift Navigation", widget: string, required: false }
          - { name: footer_contact_header, label: "Footer – Überschrift Kontakt", widget: string, required: false }
          - { name: footer_logo,      label: "Footer – Markenzeile (z.B. Komm · sprich · mit mir)", widget: string, required: false }
          - { name: footer_brand,     label: "Footer – Kurzbeschreibung", widget: text, required: false }
          - { name: footer_copyright, label: "Footer – Copyright", widget: string, required: false }
          - { name: footer_note,      label: "Footer – Hinweis", widget: string, required: false }
          - { name: footer_link_agb,         label: "Footer-Link – AGB", widget: string, required: false }
          - { name: footer_link_nutzung,     label: "Footer-Link – Nutzung & Impressum", widget: string, required: false }
          - { name: footer_link_datenschutz, label: "Footer-Link – Datenschutz (lang)", widget: string, required: false }
          - { name: footer_link_privacy,     label: "Footer-Link – Datenschutz (kurz)", widget: string, required: false }
          - { name: footer_link_imprint,     label: "Footer-Link – Impressum", widget: string, required: false }

      - name: "404"
        label: "Fehlerseite (404)"
        file: "content/de/404.json"
        fields:
          - { name: notfound_page_title, label: "404 – Browser-/SEO-Titel", widget: string, required: false }
          - { name: notfound_eyebrow, label: "404 – Kleiner Text", widget: string, required: false }
          - { name: notfound_h1, label: "404 – Hauptüberschrift", widget: string, required: false }
          - { name: notfound_h2, label: "404 – Unterüberschrift", widget: string, required: false }
          - { name: notfound_text, label: "404 – Beschreibung", widget: text, required: false }
          - { name: notfound_cta, label: "404 – Button", widget: string, required: false }

      - name: "success"
        label: "Nachricht gesendet"
        file: "content/de/success.json"
        fields:
          - { name: success_page_title, label: "Bestätigung – Browser-/SEO-Titel", widget: string, required: false }
          - { name: success_eyebrow, label: "Bestätigung – Kleiner Text", widget: string, required: false }
          - { name: success_h1, label: "Bestätigung – Hauptüberschrift", widget: string, required: false }
          - { name: success_text, label: "Bestätigung – Beschreibung", widget: text, required: false }
          - { name: success_cta, label: "Bestätigung – Button", widget: string, required: false }

  - name: "english"
    label: "English"
    files:
      - name: "startseite"
        label: "Home"
        file: "content/en/startseite.json"
        fields:
          - { name: startseite_page_title, label: "Page title – Browser / Google / sharing", widget: string, required: false, hint: "Full title shown in the browser tab and shared links." }
          - name: hero_section
            label: "1. Main image and welcome"
            widget: object
            collapsed: true
            fields:
              - { name: hero_eyebrow, label: "Small text above title", widget: string, required: false }
              - { name: hero_h1, label: "Main heading", widget: string, required: false, hint: "Edit the large heading at the top of the home page." }
              - { name: hero_p, label: "Subtitle", widget: text, required: false }
              - { name: hero_btn1, label: "Button – Appointment", widget: string, required: false }
              - { name: hero_btn2, label: "Button – About me", widget: string, required: false }
          - name: welcome_section
            label: "2. Welcome and introduction"
            widget: object
            collapsed: true
            fields:
              - { name: welcome_eyebrow, label: "Small text", widget: string, required: false }
              - { name: welcome_h2, label: "Heading", widget: string, required: false }
              - name: welcome_blocks
                label: "Paragraphs and content"
                label_singular: "Content item"
                widget: list
                required: false
                types: &blocktypes_en
                  - { name: heading, label: "Heading", widget: object, fields: [ { name: text, label: "Text", widget: string, required: false } ] }
                  - { name: subheading, label: "Subheading", widget: object, fields: [ { name: text, label: "Text", widget: string, required: false } ] }
                  - { name: text, label: "Paragraph", widget: object, fields: [ { name: text, label: "Text", widget: text, required: false } ] }
                  - { name: quote, label: "Quote", widget: object, fields: [ { name: text, label: "Text", widget: text, required: false } ] }
                  - { name: bullets, label: "Bullet list", widget: object, fields: [ { name: items, label: "Items", widget: list, required: false } ] }
                  - { name: button, label: "Button", widget: object, fields: [ { name: text, label: "Label", widget: string, required: false }, { name: link, label: "Link (e.g. kontakt.html)", widget: string, required: false } ] }
                  - { name: image, label: "Image", widget: object, fields: [ { name: image, label: "Image", widget: image, required: false }, { name: alt, label: "Image description", widget: string, required: false } ] }
                  - { name: spacer, label: "Spacer", widget: object, fields: [ { name: size, label: "Height (e.g. 2rem)", widget: string, required: false, default: "2rem" } ] }
          - name: services_section
            label: "3. Services and service cards"
            widget: object
            collapsed: true
            fields:
              - { name: services_eyebrow, label: "Small text", widget: string, required: false }
              - { name: services_h2, label: "Heading", widget: string, required: false }
              - { name: services_p, label: "Introduction", widget: text, required: false }
              - name: services_cards
                label: "Service cards"
                label_singular: "Card"
                widget: list
                required: false
                fields:
                  - { name: title, label: "Title", widget: string, required: false }
                  - { name: desc, label: "Description", widget: text, required: false }
                  - { name: link_text, label: "Link text", widget: string, required: false }
                  - { name: link, label: "Link target", widget: string, required: false }
          - name: philosophy_section
            label: "4. Quote"
            widget: object
            collapsed: true
            fields:
              - { name: phil_quote, label: "Quote text", widget: text, required: false }
              - { name: phil_cite, label: "Name below quote", widget: string, required: false }
          - name: about_section
            label: "5. About me"
            widget: object
            collapsed: true
            fields:
              - { name: aboutT_eyebrow, label: "Small text", widget: string, required: false }
              - { name: aboutT_h2, label: "Name / heading", widget: string, required: false }
              - { name: aboutT_p1, label: "Paragraph 1", widget: text, required: false }
              - { name: aboutT_p2, label: "Paragraph 2", widget: text, required: false }
              - { name: aboutT_btn, label: "Button", widget: string, required: false }
          - name: gallery_section
            label: "6. Gallery"
            widget: object
            collapsed: true
            fields:
              - { name: gallery_eyebrow, label: "Small text", widget: string, required: false }
              - { name: gallery_h2, label: "Heading", widget: string, required: false }
              - { name: gallery_p, label: "Introduction", widget: text, required: false }
              - name: gallery
                label: "Gallery images"
                label_singular: "Image"
                widget: list
                required: false
                fields:
                  - { name: image, label: "Image", widget: image, required: false }
